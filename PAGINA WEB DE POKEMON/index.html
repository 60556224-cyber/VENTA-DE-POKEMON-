                <button  class="boton-item"> agregar al carrito</button>
        </div>

        <div class="item">
            <span class="titulo-item">carta de New</span>
            <img src="SV3pt5_LA_151 enow.png" alt="" class="img-item">
            <span class="precio-item">200.00$</span>
            <button  class="boton-item"> agregar al carrito</button>
        </div>

        <div class="item">

        <div clss="item">

        </div>

         <botton class="btn-carrito" id="btn-carrito">

                <h2>Tu carrito</h2>

            <div class="carrito-items" id="carrito-items">

                </div>
